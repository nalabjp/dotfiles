# mise のグローバル既定バージョン（~/.config/mise/config.toml の [tools] を生成する）。
# machine 側の宣言が shared より優先される。
runtimes:
  shared: {}
  maui:
    ruby: "3.4.8"
  capri:
    ruby: "3.2.2"

# macOS の defaults。machine 側が shared を上書きする（domain/key 単位）。
defaults:
  shared:
    NSGlobalDomain:
      AppleInterfaceStyle: {type: string, value: Dark}
      AppleLanguages: {type: array, value: [ja-JP, en-JP]}
      AppleLocale: {type: string, value: ja_JP}
      AppleKeyboardUIMode: {type: int, value: 0}
      ApplePressAndHoldEnabled: {type: bool, value: false}
      InitialKeyRepeat: {type: int, value: 15}
      KeyRepeat: {type: int, value: 2}
      NSAutomaticCapitalizationEnabled: {type: bool, value: false}
      NSAutomaticDashSubstitutionEnabled: {type: bool, value: false}
      NSAutomaticPeriodSubstitutionEnabled: {type: bool, value: false}
      NSAutomaticQuoteSubstitutionEnabled: {type: bool, value: false}
      NSAutomaticSpellingCorrectionEnabled: {type: bool, value: false}
      com.apple.sound.beep.sound: {type: string, value: /System/Library/Sounds/Tink.aiff}
      com.apple.trackpad.forceClick: {type: bool, value: true}
      com.apple.trackpad.scaling: {type: float, value: 3}
    com.apple.dock:
      autohide: {type: bool, value: true}
      expose-group-apps: {type: bool, value: false}
      largesize: {type: int, value: 104}
      magnification: {type: bool, value: true}
      minimize-to-application: {type: bool, value: false}
      orientation: {type: string, value: bottom}
      showAppExposeGestureEnabled: {type: bool, value: false}
      tilesize: {type: int, value: 16}
      wvous-br-corner: {type: int, value: 1}
    com.apple.finder:
      AppleShowAllFiles: {type: bool, value: true}
      FXEnableExtensionChangeWarning: {type: bool, value: false}
      FXPreferredViewStyle: {type: string, value: Nlsv}
      FXRemoveOldTrashItems: {type: bool, value: true}
      NewWindowTarget: {type: string, value: PfHm}
      NewWindowTargetPath: {type: string, value: "file://~/"}
      ShowExternalHardDrivesOnDesktop: {type: bool, value: true}
      ShowHardDrivesOnDesktop: {type: bool, value: true}
      ShowPathbar: {type: bool, value: true}
      ShowStatusBar: {type: bool, value: true}
      _FXShowPosixPathInTitle: {type: bool, value: true}
      _FXSortFoldersFirst: {type: bool, value: true}
    com.apple.HIToolbox:
      AppleFnUsageType: {type: int, value: 1}
    com.apple.screencapture:
      disable-shadow: {type: bool, value: true}
      include-date: {type: bool, value: false}
      location: {type: string, value: "~/Desktop/ss"}
      type: {type: string, value: png}
    # Dynamic Profile（Library/Application Support/iTerm2/DynamicProfiles/Default.json）の Guid を既定プロファイルにする
    com.googlecode.iterm2:
      Default Bookmark Guid: {type: string, value: "05DDD52F-F9CE-4172-87EE-5FB60A7BA4DC"}
    # Alfred の設定フォルダ（Alfred.alfredpreferences の親）をソース内の alfred/ に向ける
    com.runningwithcrayons.Alfred-Preferences:
      syncfolder: {type: string, value: "~/src/nalabjp/dotfiles/alfred"}
  maui: {}
  capri: {}
